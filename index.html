<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Slay the Spire 2 Mod Manager</title>
  </head>
  <body>
    <div id="root">
      <style>
        body {
          margin: 0;
          background: #f7faf9;
        }

        .initial-loading {
          display: grid;
          min-height: 100vh;
          place-items: center;
          color: #64748b;
          font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .initial-loading div {
          display: grid;
          gap: 12px;
          justify-items: center;
        }

        .initial-loading img {
          width: 54px;
          height: 54px;
          border-radius: 14px;
          box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
        }

        .initial-loading strong {
          color: #334155;
          font-size: 14px;
        }
      </style>
      <div class="initial-loading" role="status" aria-live="polite">
        <div>
          <img src="/favicon.png" alt="" />
          <strong>STS2 Mod Manager</strong>
          <span>로딩 중...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
