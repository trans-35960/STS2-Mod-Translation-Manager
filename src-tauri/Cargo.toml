[package]
name = "sts2_mod_manager_tauri"
version = "0.4.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.7.0", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-window-state = "2.4.1"
sts2_mod_manager = { path = ".." }
krilla = { version = "0.7.0", default-features = false, features = ["simple-text"] }
ttf-parser = "0.25.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# Optimize dependencies, including the root `sts2_mod_manager` crate that does
# the mod scanning, so `tauri dev` loads close to release speed. The app crate
# itself stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
